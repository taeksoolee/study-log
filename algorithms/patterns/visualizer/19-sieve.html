<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>에라토스테네스의 체 시각화</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f1117;color:#e0e0e0;font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 24px 64px}
  header{width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
  header h1{font-size:1.4rem;color:#fff}header h1 span{color:#4d8cff}
  .back-link{font-size:.85rem;color:#888;text-decoration:none;border:1px solid #2a2d3a;padding:6px 14px;border-radius:8px}
  .back-link:hover{color:#4d8cff;border-color:#4d8cff}
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:20px}
  .panel{background:#1a1d27;border:1px solid #2a2d3a;border-radius:14px;padding:22px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label{font-size:.85rem;color:#aaa}
  input{background:#0f1117;border:1px solid #2a2d3a;color:#e0e0e0;border-radius:8px;padding:8px 10px;font-size:.9rem;width:70px}
  button{background:#4d8cff;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:.88rem;font-weight:600;cursor:pointer}
  button:hover{background:#6aa0ff}button.sec{background:#2a2d3a;color:#cfcfcf}button.sec:hover{background:#3a3e4d}
  button:disabled{opacity:.4;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#21242f;border:2px solid #2a2d3a;font-weight:700;font-size:.95rem;transition:all .15s}
  .cell.prime{background:#143a2a;border-color:#3ddc97;color:#3ddc97}
  .cell.cur{background:#4d8cff;border-color:#6aa0ff;color:#fff;transform:scale(1.06)}
  .cell.mark{background:#3a1820;border-color:#ff7597;color:#ff7597;text-decoration:line-through}
  .cell.one{opacity:.3}
  .log{font-size:.9rem;line-height:1.7;color:#cfcfcf;min-height:48px}
  .legend{font-size:.78rem;color:#888;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<header>
  <h1>에라토스테네스의 체 <span>Sieve</span></h1>
  <a class="back-link" href="./index.html">&larr; 목록</a>
</header>
<div class="wrap">
  <div class="panel controls">
    <label>N</label><input id="n" type="number" value="50" />
    <button id="build">실행</button>
    <button class="sec" id="step">다음 ▶</button>
    <button class="sec" id="play">자동 ▶▶</button>
    <button class="sec" id="reset">↺</button>
    <span style="font-size:.8rem;color:#777">i²부터 배수 제거 (√N까지)</span>
  </div>
  <div class="panel">
    <div class="legend"><span><span class="dot" style="background:#4d8cff"></span>현재 소수 i</span><span><span class="dot" style="background:#3ddc97"></span>소수 확정</span><span><span class="dot" style="background:#ff7597"></span>배수 제거</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="panel log" id="log">‘실행’으로 시작하세요.</div>
</div>
<script>
let steps=[],si=0,timer=null,N=50;
function build(){
  N=Math.max(10,Math.min(120,+document.getElementById('n').value||50));
  const isP=new Array(N+1).fill(true);isP[0]=isP[1]=false;
  steps=[];
  const snap=(cur,mark,msg)=>steps.push({isP:[...isP],cur,mark:mark!=null?mark:-1,msg});
  snap(-1,-1,`2..${N} 모두 소수로 가정하고 시작. 0,1은 제외.`);
  for(let i=2;i*i<=N;i++){
    if(isP[i]){
      snap(i,-1,`${i}는 소수. ${i}의 배수를 ${i}²=${i*i}부터 제거합니다.`);
      for(let j=i*i;j<=N;j+=i){if(isP[j]){isP[j]=false;snap(i,j,`${j} = ${i}×${j/i} → 합성수로 표시.`);}}
    }
  }
  const primes=[];for(let k=2;k<=N;k++)if(isP[k])primes.push(k);
  snap(-1,-1,`완료! ${N} 이하 소수 ${primes.length}개: ${primes.join(', ')}. 시간 O(N log log N).`);
  si=0;render();
}
function render(){
  const s=steps[si]||{isP:[]};const g=document.getElementById('grid');g.innerHTML='';
  for(let k=0;k<=N;k++){const d=document.createElement('div');d.className='cell';
    if(k<2)d.classList.add('one');
    else if(k===s.cur)d.classList.add('cur');
    else if(k===s.mark)d.classList.add('mark');
    else if(s.isP[k])d.classList.add('prime');
    else d.classList.add('mark');
    d.textContent=k;g.appendChild(d);}
  document.getElementById('log').textContent=s.msg||'';
  document.getElementById('step').disabled=si>=steps.length-1;
}
function next(){if(si<steps.length-1){si++;render();}else stop();}
function stop(){clearInterval(timer);timer=null;}
document.getElementById('build').onclick=()=>{stop();build();};
document.getElementById('step').onclick=()=>{stop();next();};
document.getElementById('play').onclick=()=>{stop();timer=setInterval(next,450);};
document.getElementById('reset').onclick=()=>{stop();si=0;render();};
build();
</script>
</body>
</html>
