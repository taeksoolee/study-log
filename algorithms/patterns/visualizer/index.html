<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알고리즘 패턴 시각화</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1rem;
      color: #888;
      letter-spacing: 0.3px;
    }

    .accent { color: #4d8cff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 960px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 14px;
      padding: 28px 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #4d8cff;
      box-shadow: 0 8px 32px rgba(77, 140, 255, 0.15);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-number {
      background: #4d8cff22;
      color: #4d8cff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid #4d8cff44;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #888;
      line-height: 1.6;
      flex: 1;
    }

    .card-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 20px;
      background: #4d8cff;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
      transition: background 0.15s ease, transform 0.1s ease;
      align-self: flex-start;
    }

    .card-btn:hover {
      background: #6aa0ff;
      transform: scale(1.03);
    }

    footer {
      margin-top: 64px;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>알고리즘 <span class="accent">패턴</span> 시각화</h1>
    <p>핵심 알고리즘 패턴을 인터랙티브하게 시각화하여 이해를 돕습니다</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>study-log &mdash; algorithm pattern visualizer</footer>

  <script>
    const pages = [
      {
        num: "01",
        title: "정렬 알고리즘",
        desc: "버블 / 선택 / 삽입 / 병합 / 퀵 / 힙 정렬을 단계별 애니메이션으로 비교해보세요. 비교·교환·정렬 완료 상태를 색상으로 구분합니다.",
        file: "01-sorting.html"
      },
      {
        num: "02",
        title: "투 포인터 패턴",
        desc: "두 포인터를 활용해 배열에서 합이 목표값인 쌍을 찾는 과정을 시각화합니다. 포인터 이동 논리를 직관적으로 확인하세요.",
        file: "02-two-pointers.html"
      },
      {
        num: "03",
        title: "슬라이딩 윈도우",
        desc: "고정·가변 크기 윈도우가 배열을 이동하며 최적값을 탐색하는 과정을 실시간으로 시각화합니다.",
        file: "03-sliding-window.html"
      },
      {
        num: "04",
        title: "BFS / DFS 패턴",
        desc: "그래프 또는 트리 위에서 너비 우선·깊이 우선 탐색이 노드를 방문하는 순서를 애니메이션으로 보여줍니다.",
        file: "04-bfs-dfs-pattern.html"
      },
      {
        num: "05",
        title: "동적 프로그래밍",
        desc: "피보나치, 배낭 문제 등 DP 테이블이 채워지는 과정을 시각화하여 메모이제이션 원리를 이해합니다.",
        file: "05-dp-visualizer.html"
      },
      {
        num: "06",
        title: "그리디 알고리즘",
        desc: "탐욕적 선택이 매 단계 어떻게 이루어지는지 애니메이션으로 확인하세요. 최적 해와의 관계도 시각적으로 표현합니다.",
        file: "06-greedy-visualizer.html"
      },
      {
        num: "07",
        title: "백트래킹",
        desc: "N-Queens, 순열 생성 등 백트래킹 탐색 트리를 그려가며 가지치기(pruning) 동작을 단계별로 시각화합니다.",
        file: "07-backtracking-visualizer.html"
      },
      {
        num: "08",
        title: "이진 탐색",
        desc: "정렬된 배열에서 lo·mid·hi 포인터가 절반씩 탐색 범위를 줄여가는 과정을 단계별로 시각화합니다.",
        file: "08-binary-search.html"
      },
      {
        num: "09",
        title: "유니온 파인드",
        desc: "union/find 연산과 경로 압축으로 서로소 집합 트리가 납작해지는 과정을 SVG 포레스트로 시각화합니다.",
        file: "09-union-find.html"
      },
      {
        num: "10",
        title: "다익스트라",
        desc: "가중 그래프에서 최소 힙으로 가장 가까운 정점을 확정하고 이웃을 완화하는 최단 경로 과정을 시각화합니다.",
        file: "10-dijkstra.html"
      },
      {
        num: "11",
        title: "위상 정렬",
        desc: "진입차수 0인 노드부터 큐로 처리하는 Kahn 알고리즘을 DAG·큐·결과와 함께 단계별로 시각화합니다.",
        file: "11-topological-sort.html"
      },
      {
        num: "12",
        title: "MST · 크루스칼",
        desc: "간선을 가중치 순으로 검토하며 사이클을 거부하고 최소 신장 트리를 만드는 과정을 시각화합니다.",
        file: "12-mst-kruskal.html"
      },
      {
        num: "13",
        title: "세그먼트 트리",
        desc: "구간 합 트리 구조와 구간 질의 시 어떤 노드가 채택·가지치기되는지를 트리로 시각화합니다.",
        file: "13-segment-tree.html"
      },
      {
        num: "14",
        title: "히스토그램 최대 직사각형",
        desc: "모노토닉 스택으로 막대를 push/pop하며 최대 직사각형 넓이를 찾는 과정을 시각화합니다.",
        file: "14-histogram-stack.html"
      },
      {
        num: "15",
        title: "최장 증가 부분 수열",
        desc: "tails 배열에 이진 탐색으로 원소를 교체·추가하며 O(n log n)으로 LIS 길이를 구하는 과정을 시각화합니다.",
        file: "15-lis.html"
      },
      {
        num: "16",
        title: "볼록 껍질",
        desc: "정렬 후 CCW로 우회전 점을 제거하며 아래·위 껍질을 만드는 모노톤 체인을 시각화합니다.",
        file: "16-convex-hull.html"
      },
      {
        num: "17",
        title: "KMP 문자열 매칭",
        desc: "실패 함수(LPS)를 이용해 불일치 시 패턴을 점프시키며 텍스트를 한 번만 훑는 매칭 과정을 시각화합니다.",
        file: "17-kmp.html"
      },
      {
        num: "18",
        title: "슬라이딩 윈도우 최댓값",
        desc: "모노토닉 덱에 인덱스를 내림차순으로 유지해 각 윈도우 최댓값을 O(n)에 구하는 과정을 시각화합니다.",
        file: "18-deque-window-max.html"
      },
      {
        num: "19",
        title: "에라토스테네스의 체",
        desc: "소수의 배수를 i²부터 제거하며 N 이하 모든 소수를 찾는 과정을 그리드로 시각화합니다.",
        file: "19-sieve.html"
      },
      {
        num: "20",
        title: "2D 누적합",
        desc: "포함-배제로 직사각형 영역 합을 O(1)에 구하는 과정을 누적합 행렬과 함께 시각화합니다.",
        file: "20-prefix-sum-2d.html"
      },
      {
        num: "21",
        title: "LCS DP 테이블",
        desc: "두 문자열의 최장 공통 부분 수열 DP 표가 채워지고 역추적으로 복원되는 과정을 시각화합니다.",
        file: "21-lcs-dp.html"
      },
      {
        num: "22",
        title: "펜윅 트리 (BIT)",
        desc: "i &amp; -i 비트 점프로 update·prefix가 O(log n)에 동작하는 과정을 시각화합니다.",
        file: "22-fenwick.html"
      },
      {
        num: "23",
        title: "플로이드-워셜",
        desc: "경유지 k를 늘려가며 모든 쌍 최단 거리 행렬이 갱신되는 DP 과정을 시각화합니다.",
        file: "23-floyd-warshall.html"
      },
      {
        num: "24",
        title: "비트마스크 부분집합",
        desc: "집합을 정수 비트로 표현하고 0~2ⁿ−1로 모든 부분집합을 열거하는 과정을 시각화합니다.",
        file: "24-bitmask-subsets.html"
      },
      {
        num: "25",
        title: "두 힙으로 중앙값",
        desc: "최대 힙·최소 힙의 균형을 유지하며 스트림의 실시간 중앙값을 구하는 과정을 시각화합니다.",
        file: "25-two-heaps-median.html"
      }
    ];

    const grid = document.getElementById("grid");

    pages.forEach(({ num, title, desc, file }) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-header">
          <span class="card-number">#${num}</span>
          <span class="card-title">${title}</span>
        </div>
        <p class="card-desc">${desc}</p>
        <a class="card-btn" href="${file}">열기 &rarr;</a>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
